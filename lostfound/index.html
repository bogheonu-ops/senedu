<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senedu 통합 시스템</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        :root { --main: #3498db; --bg: #f4f7f6; }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
            background: var(--bg);
            margin: 0; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* 모바일에서 꽉 채우기 */
        .app-container {
            width: 100%; max-width: 480px;
            background: white; padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        @media (max-width: 500px) {
            body { padding: 0; }
            .app-container { border-radius: 0; min-height: 100vh; box-shadow: none; }
        }

        .hidden { display: none !important; }

        /* 입력 필드: font-size 16px 미만이면 iOS에서 자동 확대됨 */
        input, textarea {
            width: 100%; padding: 13px; margin: 6px 0;
            border: 1px solid #ddd; border-radius: 10px;
            font-size: 16px;
            -webkit-appearance: none; appearance: none; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--main); }

        /* 파일 업로드 버튼 (모바일 갤러리/카메라 연동) */
        .file-label {
            display: block; width: 100%; padding: 12px; margin: 6px 0;
            background: #f0f7ff; border: 1.5px dashed var(--main);
            border-radius: 10px; color: var(--main);
            font-size: 15px; font-weight: 500; text-align: center;
            cursor: pointer;
        }
        .file-label:active { opacity: 0.7; }
        #post-file { display: none; }
        #file-name-display { font-size: 13px; color: #888; text-align: center; margin: 2px 0 4px; min-height: 18px; }
        #upload-status    { font-size: 13px; color: var(--main); text-align: center; margin: 2px 0; min-height: 18px; }

        /* 버튼 */
        .btn {
            width: 100%; padding: 14px; border-radius: 10px;
            font-weight: bold; font-size: 16px;
            cursor: pointer; text-align: center;
            transition: opacity 0.15s; margin-top: 8px;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .btn-blue  { background: var(--main); color: white; }
        .btn-green { background: #2ecc71; color: white; }
        .btn:active { opacity: 0.7; }

        /* 디버그 콘솔 */
        #debug-console {
            width: 100%; max-width: 480px;
            background: #2c3e50; color: #2ecc71;
            padding: 12px; border-radius: 10px; margin-top: 16px;
            font-family: monospace; font-size: 12px;
            overflow-y: auto; max-height: 120px; border: 2px solid #34495e;
        }

        /* 게시물 카드 */
        .post-card {
            border: 1px solid #eee; padding: 14px;
            margin-top: 14px; border-radius: 12px;
            position: relative; /* 삭제 버튼 absolute 포지션용 */
        }

        /* 작성자 이름: 클릭하면 DM 대상으로 자동 입력 */
        .post-author {
            color: var(--main); cursor: pointer;
            text-decoration: underline; font-size: 15px;
        }
        .post-author:hover { opacity: 0.7; }

        .post-card p { margin: 8px 0 0; font-size: 14px; color: #333; white-space: pre-wrap; word-break: break-all; }

        /* 이미지: 가로 100%, 최대 높이 제한, 비율 유지 */
        .post-img {
            display: block; width: 100%; max-height: 320px;
            object-fit: cover; border-radius: 10px; margin-top: 10px;
            background: #f0f0f0;
        }

        /* 채팅 */
        .chat-box {
            height: 220px; overflow-y: auto;
            border: 1px solid #eee; padding: 10px;
            background: #f9f9f9; border-radius: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .msg {
            max-width: 78%; padding: 9px 13px;
            border-radius: 16px; font-size: 14px;
            line-height: 1.4; word-break: break-all;
        }
        .msg.me  { align-self: flex-end;   background: #ffe812; border-bottom-right-radius: 4px; }
        .msg.you { align-self: flex-start; background: white; border: 1px solid #ddd; border-bottom-left-radius: 4px; }

        /* 채팅 입력 영역 */
        .chat-input-row { display: flex; gap: 6px; margin-top: 8px; align-items: stretch; }
        .chat-input-row input { margin: 0; }
        #chat-to  { flex: 2; }
        #chat-msg { flex: 3; }
        #btn-chat {
            flex: 0 0 56px; padding: 0; margin: 0;
            font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 로그인 화면 -->
    <div id="view-login">
        <h2 style="text-align:center; color:var(--main); margin-bottom:20px;">Senedu 센터</h2>
        <input type="email"    id="login-email" placeholder="학교 이메일 (@senedu.kr)"
               autocomplete="email" inputmode="email">
        <input type="password" id="login-pw"    placeholder="비밀번호 (6자 이상)"
               autocomplete="current-password">
        <div class="btn btn-blue" id="btn-login">입장하기</div>
    </div>

    <!-- 메인 화면 -->
    <div id="view-main" class="hidden">

        <!-- 헤더 -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <strong id="my-id" style="font-size:15px;">접속 중...</strong>
            <div class="btn" id="btn-logout"
                 style="width:auto; padding:7px 14px; font-size:13px; background:#eee; margin:0;">
                로그아웃
            </div>
        </div>

        <!-- 게시물 등록 -->
        <div style="background:#e3f2fd; padding:14px; border-radius:12px;">
            <textarea id="post-text" rows="2" placeholder="분실물 내용을 입력하세요" style="resize:none;"></textarea>
            <label class="file-label" for="post-file">📷 사진 첨부 (갤러리 / 카메라)</label>
            <input type="file" id="post-file" accept="image/*">
            <div id="file-name-display">선택된 파일 없음</div>
            <div id="upload-status"></div>
            <div class="btn btn-blue" id="btn-upload">제보 등록</div>
        </div>

        <!-- 게시물 목록 -->
        <div id="post-list"></div>

        <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">

        <!-- 채팅 -->
        <h3 style="margin:0 0 10px; font-size:16px; color:#333;">실시간 DM 톡</h3>
        <div id="chat-display" class="chat-box"></div>
        <div class="chat-input-row">
            <input type="text" id="chat-to"  placeholder="상대방 이메일" inputmode="email" autocomplete="off">
            <input type="text" id="chat-msg" placeholder="메시지" autocomplete="off">
            <div class="btn btn-green" id="btn-chat">전송</div>
        </div>

    </div>
</div>

<!-- 디버그 콘솔 -->
<div id="debug-console">시스템 로그 대기 중...</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {

    // ── 0. 설정값 ────────────────────────────────────────────────
    // ✏️ 아래 두 줄만 본인 값으로 교체하세요.
    const SUPABASE_URL   = "https://ppdzphbnqoueaqijofhq.supabase.co";
    const SUPABASE_KEY   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZHpwaGJucW91ZWFxaWpvZmhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjQ0MDMsImV4cCI6MjA5NDYwMDQwM30.6rqkky3v-VRuSS1zC1_TskkXjPa7yUCTMp7EwP-j4ZM";
    const ALLOWED_DOMAIN = "@senedu.kr";
    const ADMINS         = ["bogheonu@gmail.com", "jjinseolee@gmail.com"];

    // ── 1. Supabase 초기화 ───────────────────────────────────────
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── 2. 로그 ─────────────────────────────────────────────────
    const debugEl = document.getElementById('debug-console');
    const logger  = (msg) => {
        if (!debugEl) return;
        debugEl.innerText += '\n> ' + msg;
        debugEl.scrollTop  = debugEl.scrollHeight;
        console.log(msg);
    };

    // ── 3. 요소 참조 ────────────────────────────────────────────
    const elLoginView    = document.getElementById('view-login');
    const elMainView     = document.getElementById('view-main');
    const elMyId         = document.getElementById('my-id');
    const elBtnLogin     = document.getElementById('btn-login');
    const elBtnLogout    = document.getElementById('btn-logout');
    const elBtnUpload    = document.getElementById('btn-upload');
    const elBtnChat      = document.getElementById('btn-chat');
    const elLoginEmail   = document.getElementById('login-email');
    const elLoginPw      = document.getElementById('login-pw');
    const elPostText     = document.getElementById('post-text');
    const elPostFile     = document.getElementById('post-file');
    const elFileDisplay  = document.getElementById('file-name-display');
    const elUploadStatus = document.getElementById('upload-status');
    const elPostList     = document.getElementById('post-list');
    const elChatDisplay  = document.getElementById('chat-display');
    const elChatTo       = document.getElementById('chat-to');
    const elChatMsg      = document.getElementById('chat-msg');

    // 필수 요소 누락 시 조기 종료 (null 오류 원천 차단)
    const allEls = {
        'view-login': elLoginView, 'view-main': elMainView, 'my-id': elMyId,
        'btn-login': elBtnLogin, 'btn-logout': elBtnLogout,
        'btn-upload': elBtnUpload, 'btn-chat': elBtnChat,
        'login-email': elLoginEmail, 'login-pw': elLoginPw,
        'post-text': elPostText, 'post-file': elPostFile,
        'post-list': elPostList, 'chat-display': elChatDisplay,
        'chat-to': elChatTo, 'chat-msg': elChatMsg
    };
    for (const [id, el] of Object.entries(allEls)) {
        if (!el) { console.error('필수 요소 없음: #' + id); return; }
    }

    // 현재 로그인한 사용자 이메일 (전역 관리)
    let currentMyEmail = "";

    // ── 4. 파일 선택 시 파일명 표시 ─────────────────────────────
    elPostFile.addEventListener('change', function () {
        const file = this.files && this.files[0];
        elFileDisplay.textContent = file ? file.name : '선택된 파일 없음';
    });

    // ── 5. 화면 전환 헬퍼 ───────────────────────────────────────
    function showMain(email) {
        elLoginView.classList.add('hidden');
        elMainView.classList.remove('hidden');
        elMyId.innerText = email.split('@')[0] + ' 님';
    }
    function showLogin() {
        elMainView.classList.add('hidden');
        elLoginView.classList.remove('hidden');
    }

    // ── 6. 로그인 ───────────────────────────────────────────────
    elBtnLogin.onclick = async () => {
        const email = elLoginEmail.value.trim();
        const pw    = elLoginPw.value;

        if (!email.includes(ALLOWED_DOMAIN) && !ADMINS.includes(email)) {
            logger('오류: 허용되지 않은 이메일');
            return alert('학교 이메일(' + ALLOWED_DOMAIN + ') 또는 관리자 계정을 사용하세요.');
        }
        if (pw.length < 6) {
            logger('오류: 비밀번호 6자 이상 필요');
            return alert('비밀번호는 6자 이상입니다.');
        }

        logger('로그인 시도 중...');
        const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: pw });

        if (signInErr) {
            if (signInErr.message.includes('Invalid login credentials') ||
                signInErr.message.includes('User not found')) {
                // 계정 없으면 자동 회원가입
                logger('계정 없음 → 회원가입 시도');
                const { error: signUpErr } = await sb.auth.signUp({ email, password: pw });
                if (signUpErr) {
                    logger('가입 실패: ' + signUpErr.message);
                    return alert('가입 오류: ' + signUpErr.message);
                }
                // 가입 직후 바로 로그인 재시도
                const { error: retryErr } = await sb.auth.signInWithPassword({ email, password: pw });
                if (retryErr) {
                    logger('가입 후 로그인 실패: ' + retryErr.message);
                    return alert('가입은 완료됐습니다. 다시 [입장하기]를 눌러주세요.');
                }
                logger('가입 및 로그인 완료');
            } else {
                logger('로그인 실패: ' + signInErr.message);
                return alert('로그인 오류: ' + signInErr.message);
            }
        }
    };

    // ── 7. 로그아웃 ─────────────────────────────────────────────
    // signOut()이 ISO-8859-1 오류를 낼 수 있어서 try-catch로 감싸고
    // 실패해도 localStorage를 직접 지워서 로그아웃 처리합니다.
    elBtnLogout.onclick = async () => {
        try {
            await sb.auth.signOut();
        } catch (e) {
            console.warn('signOut 오류 (무시하고 진행):', e);
        }
        try {
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('sb-')) localStorage.removeItem(key);
            });
        } catch (e) {
            console.warn('localStorage 삭제 오류:', e);
        }
        currentMyEmail = "";
        logger('로그아웃 완료');
        showLogin();
    };

    // ── 8. 인증 상태 감시 ───────────────────────────────────────
    let postsChannel = null;
    let chatsChannel = null;

    sb.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
            currentMyEmail = session.user.email;
            const isAdmin  = ADMINS.includes(currentMyEmail);
            logger('로그인 확인: ' + currentMyEmail);
            showMain(currentMyEmail);
            startRealtimePosts(isAdmin);
            startRealtimeChats(currentMyEmail);
        } else {
            logger('로그아웃 상태');
            currentMyEmail = "";
            showLogin();
            if (postsChannel) { sb.removeChannel(postsChannel); postsChannel = null; }
            if (chatsChannel) { sb.removeChannel(chatsChannel); chatsChannel = null; }
        }
    });

    // ── 9. 게시물 조회 & 렌더링 ─────────────────────────────────
    async function fetchAndRenderPosts(isAdmin) {
        const { data, error } = await sb
            .from('posts').select('*')
            .order('created_at', { ascending: false });
        if (error) { logger('게시물 로드 실패: ' + error.message); return; }
        renderPosts(data, isAdmin);
    }

    async function startRealtimePosts(isAdmin) {
        if (postsChannel) return; // 중복 구독 방지

        await fetchAndRenderPosts(isAdmin);

        // 실시간 변경 감지 (새로고침 없이 자동 반영)
        postsChannel = sb.channel('realtime-posts')
            .on('postgres_changes',
                { event: '*', schema: 'public', table: 'posts' },
                () => {
                    logger('게시판 업데이트 감지');
                    fetchAndRenderPosts(isAdmin);
                })
            .subscribe();
    }

    function renderPosts(data, isAdmin) {
        if (!data || data.length === 0) {
            elPostList.innerHTML = '<p style="color:#aaa;text-align:center;margin-top:20px;">등록된 게시물이 없습니다.</p>';
            return;
        }
        elPostList.innerHTML = data.map(function(p) {
            const rawAuthor  = p.author || '알 수 없음';
            const authorName = rawAuthor.split('@')[0];
            const content    = p.content || '';
            const time       = p.created_at
                ? new Date(p.created_at).toLocaleString('ko-KR')
                : '';

            // 이미지: onerror로 깨진 이미지 대신 문구 표시
            const imgHtml = p.img
                ? '<img src="' + p.img + '" class="post-img" loading="lazy" '
                  + 'onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\'">'
                  + '<p style="display:none;color:#aaa;font-size:13px;text-align:center;margin-top:8px;">이미지를 불러올 수 없습니다</p>'
                : '';

            // 관리자 또는 본인 글이면 삭제 버튼 표시
            const isMyPost  = rawAuthor === currentMyEmail;
            const deleteBtn = (isAdmin || isMyPost)
                ? '<button onclick="window.deletePost(\'' + p.id + '\')" '
                  + 'style="color:red;background:none;border:none;cursor:pointer;'
                  + 'position:absolute;top:14px;right:14px;font-size:13px;">[삭제]</button>'
                : '';

            return '<div class="post-card">'
                 + '<b class="post-author" '
                 + 'onclick="window.selectChatTarget(\'' + rawAuthor + '\')" '
                 + 'title="클릭하여 DM 보내기">' + authorName + '</b>'
                 + '<span style="font-size:12px;color:#aaa;margin-left:8px;">' + time + '</span>'
                 + '<p>' + content + '</p>'
                 + imgHtml
                 + deleteBtn
                 + '</div>';
        }).join('');
    }

    // 작성자 클릭 → 채팅 대상 자동 입력 (수정본에서 추가된 기능)
    window.selectChatTarget = function(email) {
        if (email === currentMyEmail || email === '알 수 없음') {
            alert('본인에게는 DM을 보낼 수 없습니다.');
            return;
        }
        elChatTo.value = email;
        elChatMsg.focus();
        logger('채팅 대상 지정: ' + email);
    };

    // ── 10. 게시물 등록 ─────────────────────────────────────────
    elBtnUpload.onclick = async () => {
        const content = elPostText.value.trim();
        const file    = elPostFile.files && elPostFile.files[0] ? elPostFile.files[0] : null;

        if (!content) { alert('내용을 입력하세요.'); return; }
        if (!currentMyEmail) { alert('로그인이 필요합니다.'); return; }

        // 중복 클릭 방지
        elBtnUpload.style.pointerEvents = 'none';
        elUploadStatus.textContent = '등록 중...';
        logger('게시물 등록 중...');

        let img = '';
        if (file) {
            elUploadStatus.textContent = '이미지 업로드 중...';
            logger('이미지 업로드 중...');
            try {
                const fd = new FormData();
                fd.append('image', file);
                const res = await fetch(
                    'https://api.imgbb.com/1/upload?key=692797686561f516a5196696e382898c',
                    { method: 'POST', body: fd }
                );
                const d = await res.json();
                if (d && d.success) {
                    img = d.data.url;
                    logger('이미지 업로드 성공');
                } else {
                    logger('이미지 서버 오류 → 텍스트만 등록');
                }
            } catch (e) {
                logger('이미지 업로드 실패 → 텍스트만 등록');
            }
        }

        const { error } = await sb.from('posts').insert({
            content : content,
            img     : img,
            author  : currentMyEmail
        });

        // 버튼 다시 활성화
        elBtnUpload.style.pointerEvents = 'auto';

        if (error) {
            elUploadStatus.textContent = '등록 실패';
            logger('등록 실패: ' + error.message);
            alert('등록에 실패했습니다: ' + error.message);
            return;
        }

        elPostText.value          = '';
        elPostFile.value          = '';
        elFileDisplay.textContent = '선택된 파일 없음';
        elUploadStatus.textContent = '';
        logger('게시물 등록 완료 (실시간 반영)');
        // 실시간 구독이 자동으로 목록을 갱신하므로 location.reload() 불필요
    };

    // ── 11. 게시물 삭제 ─────────────────────────────────────────
    window.deletePost = async function(id) {
        if (!id) return;
        if (!confirm('정말 이 게시물을 삭제하시겠습니까?')) return;
        const { error } = await sb.from('posts').delete().eq('id', id);
        if (error) {
            logger('삭제 실패: ' + error.message);
            alert('삭제 권한이 없거나 오류가 발생했습니다.');
            return;
        }
        logger('삭제 완료 (실시간 반영)');
        // 실시간 구독이 자동으로 목록을 갱신하므로 location.reload() 불필요
    };

    // ── 12. 채팅 로드 & 실시간 구독 ────────────────────────────
    async function startRealtimeChats(myEmail) {
        if (chatsChannel) return;

        const { data, error } = await sb
            .from('chats').select('*')
            .or('sender.eq.' + myEmail + ',receiver.eq.' + myEmail)
            .order('created_at', { ascending: true });

        if (error) { logger('채팅 로드 실패: ' + error.message); return; }
        renderChats(data, myEmail);

        chatsChannel = sb.channel('realtime-chats')
            .on('postgres_changes',
                { event: 'INSERT', schema: 'public', table: 'chats' },
                function({ new: row }) {
                    if (!row) return;
                    if (row.sender !== myEmail && row.receiver !== myEmail) return;
                    const isMe = row.sender === myEmail;
                    elChatDisplay.innerHTML +=
                        '<div class="msg ' + (isMe ? 'me' : 'you') + '">'
                        + (row.msg || '') + '</div>';
                    elChatDisplay.scrollTop = elChatDisplay.scrollHeight;
                })
            .subscribe();
    }

    function renderChats(data, myEmail) {
        if (!data || data.length === 0) {
            elChatDisplay.innerHTML =
                '<p style="color:#aaa;text-align:center;font-size:13px;margin-top:20px;">'
                + '작성자 이름을 클릭하여 DM을 시작해 보세요.</p>';
            return;
        }
        elChatDisplay.innerHTML = data.map(function(c) {
            const isMe = c.sender === myEmail;
            return '<div class="msg ' + (isMe ? 'me' : 'you') + '">' + (c.msg || '') + '</div>';
        }).join('');
        elChatDisplay.scrollTop = elChatDisplay.scrollHeight;
    }

    // ── 13. 채팅 전송 ───────────────────────────────────────────
    elBtnChat.onclick = async () => {
        const to  = elChatTo.value.trim();
        const msg = elChatMsg.value.trim();

        if (!to || !msg) { alert('상대방 이메일과 메시지를 입력하세요.'); return; }
        if (to === currentMyEmail) { alert('나 자신에게는 보낼 수 없습니다.'); return; }
        if (!currentMyEmail) { alert('로그인이 필요합니다.'); return; }

        const { error } = await sb.from('chats').insert({
            sender  : currentMyEmail,
            receiver: to,
            msg     : msg
        });

        if (error) {
            logger('채팅 전송 실패: ' + error.message);
            alert('전송 실패: ' + error.message);
            return;
        }
        elChatMsg.value = '';
        elChatMsg.focus();
    };

    // 엔터키로 채팅 전송 (수정본에서 추가된 기능)
    elChatMsg.addEventListener('keyup', function(e) {
        if (e.key === 'Enter') elBtnChat.click();
    });

}); // DOMContentLoaded 끝
</script>

</body>
</html>
